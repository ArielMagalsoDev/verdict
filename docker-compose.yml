services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verdict
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["verdict_data:/var/lib/postgresql/data"]
  web:
    build: .
    # --proxy-headers/--forwarded-allow-ips: trust the upstream's X-Forwarded-Proto
    # so request.url_for() reports https behind a TLS-terminating reverse proxy
    # (e.g. the Traefik in front of this on the VPS) instead of the plain-http
    # transport between the proxy and this container.
    command: uvicorn verdict.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://verdict:verdict@db:5432/verdict
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    command: verdict-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://verdict:verdict@db:5432/verdict
    depends_on:
      db: {condition: service_healthy}
volumes:
  verdict_data:
