services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verdict
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["verdict_data:/var/lib/postgresql/data"]
  web:
    build: .
    command: uvicorn verdict.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://verdict:verdict@db:5432/verdict
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    command: verdict-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://verdict:verdict@db:5432/verdict
    depends_on:
      db: {condition: service_healthy}
volumes:
  verdict_data:
