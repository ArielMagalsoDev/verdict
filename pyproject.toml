[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict-python"
version = "0.1.0"
description = "Evidence-gated AI lead qualification and approval-gated CRM writes"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.49,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
verdict-worker = "verdict.worker:main"
verdict-evals = "verdict.evals.__main__:main"

[tool.vercel]
entrypoint = "verdict.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
verdict = ["templates/*.html", "templates/partials/*.html", "static/css/*", "static/js/*", "static/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008", "BLE001"]
